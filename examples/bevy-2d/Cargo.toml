[package]
name = "bevy-2d"
version = "0.2.3"
authors = ["DodoRare Team <support@dodorare.com>"]
edition.workspace = true

[dependencies]
crossbow = { workspace = true, default-features = true }
log = { workspace = true }
anyhow = { workspace = true }
bevy = { workspace = true, default-features = false, features = ["2d"] }

[package.metadata]
app_name = "Bevy 2D"
assets = ["../../assets"]

[package.metadata.android]
release_build_targets = ["aarch64-linux-android"]
resources = ["../../assets/res/android"]

[package.metadata.apple]
release_build_targets = ["aarch64-apple-ios", "x86_64-apple-ios"]
resources = ["../../assets/res/apple"]
