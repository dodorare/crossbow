name: CI

on:
  push:
    branches: [main]
    paths:
      - '.github/docker/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '**.rs'
      - '**.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - 'platform/android/**'
      - 'plugins/*/android/**'
  pull_request:
    paths:
      - '.github/docker/**'
      - '.github/scripts/**'
      - '.github/workflows/**'
      - '**.rs'
      - '**.toml'
      - 'Cargo.lock'
      - 'docs/**'
      - 'platform/android/**'
      - 'plugins/*/android/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  ANDROID_API_LEVEL: '36'
  ANDROID_BUILD_TOOLS_VERSION: '36.0.0'
  ANDROID_NDK_VERSION: '28.2.13676358'
  BUNDLETOOL_VERSION: '1.18.3'
  GRADLE_VERSION: '9.5.0'

jobs:
  lint:
    name: Format and Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check tool version consistency
        run: cargo run -p xtask --locked -- android-stack check
      - name: Run Clippy
        working-directory: crossbundle/cli
        run: >-
          cargo clippy --all-targets --all-features --locked --
          -D warnings
          -A clippy::unnecessary-unwrap
          -A clippy::too-many-arguments
          -A clippy::result_large_err

  docs:
    name: Check documentation links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install cargo-deadlinks
        run: cargo install cargo-deadlinks --version 0.8.1 --locked
      - name: Check local Rustdoc links
        env:
          RUST_LOG: error
        run: cargo deadlinks

  tests:
    name: Android tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            g++ \
            libasound2-dev \
            libudev-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-0 \
            pkg-config
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platform-tools"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Compile Android app and plugins
        working-directory: platform/android/java
        run: >-
          ./gradlew -Pcrossbow.includeLocalPlugins=true
          :app:compileDebugKotlin
          :admob:compileDebugKotlin
          :play_billing:compileDebugKotlin
          :play_billing:testDebugUnitTest
          :play_core:compileDebugKotlin
          :play_games_services:compileDebugKotlin
          --no-daemon
      - name: Install bundletool
        run: |
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$bundletool"
          echo "BUNDLETOOL_PATH=$bundletool" >> "$GITHUB_ENV"
      - name: Validate the shared Android toolchain contract
        run: |
          cargo run -p crossbundle --no-default-features --features android --locked -- doctor --platform android --strict --json > doctor-android.json
          cargo run -p crossbundle --locked -- doctor --strict --json > doctor-default.json
          jq -e '.schema_version == 1 and .platforms == ["android"] and .status == "pass"' doctor-android.json > /dev/null
          jq -e '.schema_version == 1 and .platforms == ["android", "apple"] and .status == "pass" and ([.checks[] | select(.id | startswith("apple.")) | .status] | length > 0 and all(. == "skip"))' doctor-default.json > /dev/null
      - name: Run full non-iOS workspace tests
        env:
          CROSSBOW_TEST_WORKSPACE: ${{ github.workspace }}
        run: >-
          cargo test --workspace --all-targets --exclude crossbow-ios
          --locked --no-fail-fast
      - name: Run Android-only tests
        env:
          CROSSBOW_TEST_WORKSPACE: ${{ github.workspace }}
        run: |
          cargo test -p crossbundle-tools --no-default-features --features android --all-targets --locked --no-fail-fast
          cargo test -p crossbundle --no-default-features --features android --all-targets --locked --no-fail-fast

  apple-tests:
    name: Apple tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install Apple targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim x86_64-apple-ios
      - name: Validate the Apple toolchain contract
        run: |
          cargo run -p crossbundle --no-default-features --features apple --locked -- doctor --platform apple --strict --json > doctor-apple.json
          jq -e '.schema_version == 1 and .platforms == ["apple"] and .status == "pass"' doctor-apple.json > /dev/null
      - name: Run Apple CLI and platform tests
        env:
          CROSSBOW_TEST_WORKSPACE: ${{ github.workspace }}
        run: |
          cargo test -p crossbundle-tools --no-default-features --features apple --all-targets --locked --no-fail-fast
          cargo test -p crossbundle --no-default-features --features apple --all-targets --locked --no-fail-fast
          cargo test -p crossbow-ios --all-targets --locked --no-fail-fast

  android-build-ubuntu:
    name: Build Android example on Ubuntu
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install Android SDK and NDK
        run: |
          sdkmanager="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$sdkmanager" --licenses >/dev/null || true
          "$sdkmanager" \
            "platforms;android-$ANDROID_API_LEVEL" \
            "build-tools;$ANDROID_BUILD_TOOLS_VERSION" \
            "ndk;$ANDROID_NDK_VERSION" \
            "platform-tools"
          echo "ANDROID_NDK_ROOT=$ANDROID_SDK_ROOT/ndk/$ANDROID_NDK_VERSION" >> "$GITHUB_ENV"
      - name: Install bundletool
        run: |
          bundletool="$RUNNER_TEMP/bundletool.jar"
          curl --fail --location --silent --show-error \
            "https://github.com/google/bundletool/releases/download/$BUNDLETOOL_VERSION/bundletool-all-$BUNDLETOOL_VERSION.jar" \
            --output "$bundletool"
          echo "BUNDLETOOL_PATH=$bundletool" >> "$GITHUB_ENV"
      - name: Install Crossbundle
        run: cargo install --path ./crossbundle/cli --locked
      - name: Validate toolchain and dry-run plan
        working-directory: examples/macroquad-3d
        run: |
          crossbundle doctor --platform android --strict --json > doctor-android.json || { cat doctor-android.json; exit 1; }
          crossbundle doctor --strict --json > doctor-default.json || { cat doctor-default.json; exit 1; }
          crossbundle build android -s=native-apk --release --dry-run --json > plan.json || { cat plan.json; exit 1; }
          jq -e '.schema_version == 1 and .platforms == ["android"] and .status == "pass"' doctor-android.json > /dev/null
          jq -e '.schema_version == 1 and .platforms == ["android", "apple"] and .status == "pass" and ([.checks[] | select(.id | startswith("apple.")) | .status] | length > 0 and all(. == "skip"))' doctor-default.json > /dev/null
          jq -e '.schema_version == 1' plan.json > /dev/null
      - name: Build APK
        working-directory: examples/macroquad-3d
        run: crossbundle build android -s=native-apk --release

  android-build-windows:
    name: Build Android example on Windows
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install Rust Android targets
        run: rustup target add aarch64-linux-android x86_64-linux-android
      - name: Install Crossbundle and preferred Android tools
        shell: pwsh
        run: |
          $repo = (Resolve-Path .).Path.Replace('\', '/')
          cargo install --git "file:///$repo" crossbundle --locked

          $hostSdk = $env:ANDROID_SDK_ROOT
          $sdk = Join-Path $env:RUNNER_TEMP 'crossbundle-android-sdk'
          New-Item -ItemType Directory -Path $sdk -Force | Out-Null
          if (Test-Path (Join-Path $hostSdk 'licenses')) {
            Copy-Item (Join-Path $hostSdk 'licenses') $sdk -Recurse
          }

          $env:ANDROID_SDK_ROOT = $sdk
          $env:ANDROID_HOME = $sdk
          crossbundle install --preferred

          $ndk = Join-Path $sdk "ndk\$env:ANDROID_NDK_VERSION"
          "ANDROID_SDK_ROOT=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_HOME=$sdk" | Out-File -FilePath $env:GITHUB_ENV -Append
          "ANDROID_NDK_ROOT=$ndk" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Validate Android toolchain
        working-directory: examples/macroquad-permissions
        shell: pwsh
        run: crossbundle doctor --platform android --strict --json
      - name: Validate default multi-platform doctor
        working-directory: examples/macroquad-permissions
        shell: pwsh
        run: >-
          crossbundle doctor --strict --json |
          jq -e '.schema_version == 1 and .platforms == ["android", "apple"] and
          .status == "pass" and ([.checks[] | select(.id | startswith("apple.")) |
          .status] | length > 0 and all(. == "skip"))'
      - name: Validate Android dry-run plan
        working-directory: examples/macroquad-permissions
        shell: pwsh
        run: crossbundle build android --release --dry-run --json
      - name: Build APK
        working-directory: examples/macroquad-permissions
        run: crossbundle build android --release

  apple-build-macos:
    name: Build Apple example on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ runner.arch }}-${{ github.job }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-
      - name: Install Apple targets
        run: rustup target add aarch64-apple-ios aarch64-apple-ios-sim
      - name: Install Crossbundle
        run: cargo install --path ./crossbundle/cli --locked
      - name: Validate Apple doctor
        run: |
          crossbundle doctor --platform apple --strict --json > doctor-apple.json
          jq -e '.schema_version == 1 and .platforms == ["apple"] and .status == "pass"' doctor-apple.json > /dev/null
      - name: Build Apple app
        working-directory: examples/macroquad-3d
        run: crossbundle build ios --release --target=aarch64-apple-ios

  docker:
    name: Build Crossbundle example in Docker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Build Crossbundle image
        run: docker build --tag crossbundle-ci --file .github/docker/crossbundle.Dockerfile .
      - name: Build Crossbundle example
        run: >-
          docker run --rm
          --volume "${{ github.workspace }}:/src"
          --workdir /src/examples/macroquad-permissions
          crossbundle-ci build android --release
