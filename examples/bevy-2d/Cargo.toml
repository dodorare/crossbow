[package]
name = "bevy-2d"
version = "0.2.3"
authors = ["DodoRare Team <support@dodorare.com>"]
edition.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
crossbow = { workspace = true, default-features = true }
log = { workspace = true }
anyhow = { workspace = true }
bevy = { workspace = true, default-features = false, features = ["2d"] }

[target.'cfg(target_os = "android")'.dependencies]
# NativeActivity keeps the standard Cargo-to-APK path self-contained: no
# Gradle, Java/Kotlin compiler, or Maven dependency resolution is required.
bevy = { workspace = true, default-features = false, features = ["android-native-activity"] }

[package.metadata]
app_name = "Bevy 2D"
assets = ["../../assets"]

[package.metadata.android]
release_build_targets = ["aarch64-linux-android"]
resources = ["../../assets/res/android"]

[package.metadata.apple]
resources = ["../../assets/res/apple"]
